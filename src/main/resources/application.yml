spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: TaxRateSystemBackend

  profiles:
    active: dev

server:
  port: 8080
  address: 0.0.0.0

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    # When false, e-mails (including OTP codes) are logged instead of sent.
    # Intended for local development only - never disable in production.
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    length: ${OTP_LENGTH:6}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:45}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:15}

logging:
  level:
    root: INFO
    com.taxratesystem: INFO